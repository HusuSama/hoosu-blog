<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" role="img" aria-labelledby="title desc"><title id="title">元素截图与独立图片资源的区别</title><desc id="desc">页面截图包含背景与起始拼图的叠加，独立背景资源不包含起始拼图，独立拼图资源保留透明区域。</desc><style>text{font:14px sans-serif;fill:var(--fg,currentColor)}.muted{fill:var(--muted,currentColor)}.frame{fill:none;stroke:var(--border,currentColor)}.piece{fill:none;stroke:var(--accent,currentColor);stroke-width:3}.scene{fill:none;stroke:var(--muted,currentColor);opacity:.55}.hole{fill:none;stroke:var(--warning,currentColor);stroke-width:2;stroke-dasharray:5 4}</style><text x="20" y="25">页面渲染区域 / 元素截图</text><rect class="frame" x="20" y="45" width="350" height="160" rx="6"/><path class="scene" d="M20 170 L95 95 L165 155 L235 80 L370 175 M20 185 H370"/><path class="piece" d="M40 105 H65 Q65 80 80 80 Q95 80 95 105 H120 V155 H40 Z"/><path class="hole" d="M255 105 H280 Q280 80 295 80 Q310 80 310 105 H335 V155 H255 Z"/><text x="40" y="230">起始拼图也进入“背景截图”</text><text class="muted" x="40" y="255">相同内容可能在起点获得最高分</text><text x="430" y="25">独立图片资源</text><rect class="frame" x="430" y="45" width="350" height="160" rx="6"/><path class="scene" d="M430 170 L505 95 L575 155 L645 80 L780 175 M430 185 H780"/><path class="hole" d="M665 105 H690 Q690 80 705 80 Q720 80 720 105 H745 V155 H665 Z"/><text x="440" y="230">背景原图：只含背景与缺口</text><rect class="frame" x="430" y="246" width="60" height="30"/><path class="piece" d="M440 254 H451 Q451 246 457 246 Q463 246 463 254 H480 V270 H440 Z"/><text x="505" y="268">拼图原图：周围透明，单独处理</text></svg>