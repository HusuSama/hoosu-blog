<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" role="img" aria-labelledby="title desc"><title id="title">裁剪保留可见拼图并记录原图偏移</title><desc id="desc">透明画布中的可见拼图从左上偏移处开始，裁剪后以新的左上角为原点，但计算移动距离仍需原始裁剪偏移。</desc><style>text{font:14px sans-serif;fill:var(--fg,currentColor)}.frame{fill:none;stroke:var(--border,currentColor)}.piece{fill:none;stroke:var(--accent,currentColor);stroke-width:3}.guide{fill:none;stroke:var(--muted,currentColor);stroke-dasharray:4 4}.arrow{fill:none;stroke:var(--fg,currentColor);stroke-width:2}</style><text x="20" y="25">完整拼图原图（大部分区域透明）</text><rect class="frame" x="25" y="48" width="260" height="190"/><text x="32" y="67">原点 (0, 0)</text><path class="piece" d="M105 138 H130 Q130 113 145 113 Q160 113 160 138 H190 V203 H105 Z"/><path class="guide" d="M105 48 V113 M25 113 H105"/><rect class="guide" x="100" y="108" width="95" height="100"/><text x="113" y="94">crop_left</text><text x="30" y="103">crop_top</text><text x="25" y="264">记录边界 (left, top, right, bottom)</text><path class="arrow" d="M320 147 H408 M396 139 L408 147 L396 155"/><text x="331" y="126">裁剪</text><text x="450" y="25">裁剪模板与轮廓</text><rect class="frame" x="450" y="70" width="115" height="125"/><path class="piece" d="M455 105 H487 Q487 75 505 75 Q523 75 523 105 H560 V190 H455 Z"/><text x="450" y="225">模板原点重新变为 (0, 0)</text><text x="450" y="250">换算位移时仍需减去原始裁剪偏移</text><text x="600" y="104">透明通道</text><path class="guide" d="M575 134 H735"/><text x="600" y="159">二值化 → 轮廓</text><text x="600" y="188">减少内部纹理干扰</text></svg>