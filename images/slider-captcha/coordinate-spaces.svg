<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-labelledby="title desc"><title id="title">原图坐标转换为页面拖动距离</title><desc id="desc">原图中的匹配横坐标与裁剪偏移通过各自缩放比例和页面起点转换，目标页面坐标减去当前页面坐标才是拖动距离。</desc><style>text{font:14px sans-serif;fill:var(--fg,currentColor)}.frame{fill:none;stroke:var(--border,currentColor)}.line{fill:none;stroke:var(--muted,currentColor)}.piece{fill:none;stroke:var(--accent,currentColor);stroke-width:2}.target{fill:none;stroke:var(--warning,currentColor);stroke-width:2;stroke-dasharray:4 3}.arrow{fill:none;stroke:var(--fg,currentColor);stroke-width:2}</style><text x="20" y="25">背景原图坐标</text><rect class="frame" x="20" y="45" width="740" height="65"/><rect class="target" x="505" y="55" width="60" height="45"/><text x="32" y="82">(0, 0)</text><text x="492" y="133">matched_left</text><path class="arrow" d="M375 135 V173 M367 161 L375 173 L383 161"/><text x="399" y="160">各自缩放比例 + 页面位置</text><text x="20" y="197">页面 CSS 坐标</text><rect class="frame" x="90" y="212" width="480" height="60"/><rect class="piece" x="112" y="222" width="36" height="36"/><rect class="target" x="385" y="222" width="36" height="36"/><path class="arrow" d="M154 238 H378 M366 230 L378 238 L366 246"/><text x="203" y="229">delta_x</text><path class="line" d="M90 212 V285 M112 258 V285 M385 258 V285"/><text x="87" y="298">图片起点</text><text x="186" y="298">当前拼图左边缘</text><text x="392" y="298">目标左边缘</text><text x="600" y="219">target_page_x</text><text x="600" y="242">− current_page_x</text><text x="600" y="265">= 拖动距离</text></svg>